# Härtung der Apache-Auslieferung im Tourlocate-Container.
#
# Wird per Dockerfile nach /etc/apache2/conf-enabled/ kopiert und gilt
# damit serverweit — UNABHÄNGIG von AllowOverride/.htaccess (das
# php:*-apache-Basisimage setzt standardmäßig "AllowOverride None",
# wodurch die zur Laufzeit erzeugte .htaccess im Datenverzeichnis sonst
# wirkungslos bliebe).

# 1) Datenverzeichnis NIE über HTTP ausliefern. Enthält die SQLite-
#    Datenbank (Passwort-Hashes, Teilen-Tokens, TOTP-Secrets, verschlüsselte
#    WebDAV-Passwörter), alle hochgeladenen Bilder und config.php mit dem
#    Server-Schlüssel. Der App-Code liest diese Dateien direkt vom
#    Dateisystem (readfile in api/image.php), nicht über HTTP — die Sperre
#    bricht also nichts.
<Directory /var/www/html/app/data>
    Require all denied
</Directory>

# 2) Verzeichnislisting serverweit abschalten (kein Durchblättern von
#    Ordnern, falls mal eine index-Datei fehlt).
<Directory /var/www/html>
    Options -Indexes
</Directory>
