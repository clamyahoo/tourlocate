; Härtung der PHP-Laufzeit im Tourlocate-Container.
;
; Tourlocate ruft NIE Shell-/Prozess-Funktionen auf: Bildverarbeitung
; läuft über GD, die Datenbank über PDO, Krypto über sodium, WebDAV über
; curl. Diese Funktionen lassen sich daher gefahrlos abschalten.
;
; Nutzen (Tiefenverteidigung): Sollte es jemandem je gelingen, über eine
; Lücke PHP-Code einzuschleusen, kann er damit zumindest NICHT aus PHP
; heraus Befehle auf dem Host ausführen (shell_exec, system & Co. sind
; weg). Das verhindert keinen direkten Datenbankzugriff über PDO, nimmt
; aber den bequemsten Weg zur Host-Kontrolle.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,proc_nice

; PHP-Version nicht im HTTP-Header (X-Powered-By) preisgeben.
expose_php = Off
